version: '3.8'

services:
  backend:
    container_name: backend
    build: ./backend
    env_file:
      - ./backend/.env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod #Django가 어떤 settings 파일을 사용할지 지정
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 # 배포에서는 gunicorn으로 웹서버(nginx) -> 장고 연결
    volumes:
      - ./backend:/app/backend
    expose:
      - 8000


  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend


