version: '3.8'

services:
  backend:
    build: ./backend
    command: gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
    expose:
      - 8000

frontend:
  build:
    context: .
    dockerfile: frontend/Dockerfile
  volumes:
    - ./frontend:/app/frontend
  working_dir: /app/frontend

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
