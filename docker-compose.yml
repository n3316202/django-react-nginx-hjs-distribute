version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backend
    volumes:
      - ./backend:/app
    env_file:
      - .env
    expose:
      - "8000"
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"  # 외부에서 8080 → Nginx 컨테이너 내부 80번 포트로 포워딩
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - frontend
