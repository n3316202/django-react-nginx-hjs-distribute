name: Deploy to EC2

on:
  push:
    branches:
      #- dev_8_again_리액트_추가-2025-05-30
jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
        #GitHub Actions는 리포지토리 코드를 자동으로 불러오지 않기 때문
        #즉, 워크플로우에서 Python, Node, Django 등으로 무언가 빌드/테스트/배포하려면 먼저 코드를 내려받아야 하는데, 
        #그 역할을 이 액션이 수행
      - name: Checkout repository
        uses: actions/checkout@v3

         
       # 1. EC2에 프로젝트 디렉토리 생성 (최상위 폴더까지만)
      - name: Create remote directory on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo rm -rf /home/ubuntu/django-react-nginx-hjs-distribute
            mkdir -p /home/ubuntu/django-react-nginx-hjs-distribute
            
      
      # 2. 코드 EC2로 전송
      - name: Rsync source code to EC2
        uses: burnett01/rsync-deployments@4.1
        with:
          switches: -avzr --delete
          remote_path: /home/ubuntu/django-react-nginx-hjs-distribute/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_KEY }}
      
      # ✅ 3. backend 디렉토리에 .env.prod 생성 (코드 업로드 이후)
      - name: Create .env.prod on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: DJANGO_ENV_PROD_CONTENTS
          script: |
            echo "✅ Copying .env.prod files to project"
            cp /home/ubuntu/django_settings/django.env.prod /home/ubuntu/django-react-nginx-hjs-distribute/backend/.env.prod
            echo "✅ Done copying environment files"
                
      - name: Run Docker Compose on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sh /home/ubuntu/django-react-nginx-hjs-distribute/backend/config/scripts/deploy.sh
